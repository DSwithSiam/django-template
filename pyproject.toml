[project]
name = "myproject"
version = "0.1.0"
description = "Django REST API project with a clean, scalable structure"
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
testpaths = ["apps"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".venv",
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config", "helpers", "infrastructure"]

[tool.black]
line-length = 100
target-version = ["py310"]
