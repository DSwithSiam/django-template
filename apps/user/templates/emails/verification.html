<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2>Verify Your Email</h2>
    <p>Hi {{ display_name }},</p>
    <p>Thank you for registering with {{ project_name }}. Please verify your email by clicking the button below:</p>
    <p style="text-align: center; margin: 30px 0;">
        <a href="{{ verification_link }}"
           style="background-color: #4CAF50; color: white; padding: 14px 28px; text-decoration: none; border-radius: 5px; display: inline-block;">
            Verify Email
        </a>
    </p>
    <p>Or copy this link: <a href="{{ verification_link }}">{{ verification_link }}</a></p>
    <p>This link will expire in 24 hours.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="color: #999; font-size: 12px;">&copy; {{ year }} {{ project_name }}. All rights reserved.</p>
</body>
</html>
