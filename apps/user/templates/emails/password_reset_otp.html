<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2>Password Reset</h2>
    <p>Hi {{ display_name }},</p>
    <p>You requested a password reset for your {{ project_name }} account. Use the OTP below:</p>
    <p style="text-align: center; margin: 30px 0;">
        <span style="background-color: #f4f4f4; padding: 15px 30px; font-size: 32px; font-weight: bold; letter-spacing: 8px; border-radius: 5px; display: inline-block;">
            {{ otp }}
        </span>
    </p>
    <p>This code expires in <strong>5 minutes</strong>.</p>
    <p>If you didn't request this, please ignore this email.</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="color: #999; font-size: 12px;">&copy; {{ year }} {{ project_name }}. All rights reserved.</p>
</body>
</html>
